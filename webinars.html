<!DOCTYPE html>
<html>
<head>
    <title>Webinars</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            Alumni Interaction Portal
        </a>
    </div>
</nav>

<div class="container py-5">

    <h1>Upcoming Webinars</h1>
    <p class="text-muted">
        Attend sessions conducted by experienced alumni.
    </p>

    <div class="row g-4 mt-3">

        {% for webinar in webinars %}

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h3>{{ webinar.title }}</h3>

                    <p>
                        <strong>Speaker:</strong>
                        {{ webinar.speaker }}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        {{ webinar.date }}
                    </p>

                    <p>
                        {{ webinar.description }}
                    </p>

                    <button class="btn btn-dark">
                        Register for Webinar
                    </button>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    <a href="{{ url_for('home') }}"
       class="btn btn-outline-dark mt-4">
        ← Back to Home
    </a>

</div>

</body>
</html>
