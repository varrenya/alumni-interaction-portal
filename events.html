<!DOCTYPE html>
<html>
<head>
    <title>Events</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            Alumni Interaction Portal
        </a>
    </div>
</nav>

<div class="container py-5">

    <h1>Events</h1>

    <p class="text-muted">
        Explore alumni achievements, college achievements and reunions.
    </p>

    <div class="row g-4 mt-3">

        {% for event in events %}

        <div class="col-md-6 col-lg-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <span class="badge bg-dark mb-2">
                        {{ event.type }}
                    </span>

                    <h3>{{ event.title }}</h3>

                    <p>
                        <strong>Date:</strong>
                        {{ event.date }}
                    </p>

                    <p>
                        {{ event.description }}
                    </p>

                    <button class="btn btn-outline-dark">
                        View Event
                    </button>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    <a href="{{ url_for('home') }}"
       class="btn btn-outline-dark mt-4">
        ← Back to Home
    </a>

</div>

</body>
</html>
